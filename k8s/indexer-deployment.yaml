apiVersion: apps/v1
kind: Deployment
metadata:
  name: nightmint-indexer
  namespace: nightmint
  labels:
    app.kubernetes.io/name: nightmint-indexer
    app.kubernetes.io/part-of: nightmint
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Ponder writes to one schema. Never run old and new indexers concurrently.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nightmint-indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nightmint-indexer
        app.kubernetes.io/part-of: nightmint
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: indexer
          image: ghcr.io/marcioecom/nightmint-indexer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 42069
          env:
            - name: DATABASE_SCHEMA
              value: nightmint
          envFrom:
            - secretRef:
                name: nightmint-indexer-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 180
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      automountServiceAccountToken: false
